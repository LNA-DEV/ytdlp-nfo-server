<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="dark">
<title>ytdlp-nfo Server</title>
<link rel="stylesheet" href="css/style.css">
<script type="module" src="js/app.js"></script>
</head>
<body>
<header class="topbar">
  <a class="brand" href="#/">ytdlp-nfo Server</a>
  <span class="ytdlp-badge" id="ytdlp-badge" title="Active yt-dlp version"></span>
  <span class="update-badge hidden" id="update-badge" title="A newer yt-dlp version is available">update</span>
  <span class="warn-badge hidden" id="imp-badge" title="Impersonation is not available in the active yt-dlp build">no impersonation</span>
  <nav class="topnav">
    <a href="#/" data-nav="jobs">Downloads</a>
    <a href="#/subscriptions" data-nav="subscriptions">Subscriptions</a>
    <a href="#/archive" data-nav="archive">Archive</a>
    <a href="#/diagnostics" data-nav="diagnostics" title="Diagnostics">ⓘ</a>
    <a href="#/settings" data-nav="settings" title="Settings">⚙</a>
    <button class="link-btn hidden" id="logout-btn" type="button">Log out</button>
  </nav>
</header>

<div id="banners"></div>
<main id="view" class="container"></main>

<div id="login" class="overlay hidden">
  <form class="dialog login-box" id="login-form">
    <h2>Login required</h2>
    <input type="password" id="login-password" placeholder="Password" autocomplete="current-password" required>
    <button type="submit" class="btn primary">Log in</button>
    <div class="error" id="login-error"></div>
  </form>
</div>

<div id="modal" class="overlay hidden"><div class="dialog" id="modal-body"></div></div>
<div id="toasts"></div>
</body>
</html>
